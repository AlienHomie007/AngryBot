name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk AngryBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AngryBot-apk
          path: AngryBot.apk
      # Public download link that never changes:
      # https://github.com/AlienHomie007/AngryBot/releases/latest/download/AngryBot.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: AngryBot (latest build)
          body: Download AngryBot.apk below and open it on your Android phone.
          files: AngryBot.apk
          make_latest: true
