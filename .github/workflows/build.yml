name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk AngryBot.apk
          cp ai/build/outputs/apk/debug/ai-debug.apk AngryBot-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AngryBot-apks
          path: |
            AngryBot.apk
            AngryBot-AI.apk
      # Public download links that never change:
      # https://github.com/AlienHomie007/AngryBot/releases/latest/download/AngryBot.apk
      # https://github.com/AlienHomie007/AngryBot/releases/latest/download/AngryBot-AI.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: AngryBot (latest build)
          body: |
            AngryBot.apk - the recorder: record a level once, replay it.
            AngryBot-AI.apk - the AI: watches the screen live and plays by itself (Android 11+).
          files: |
            AngryBot.apk
            AngryBot-AI.apk
          make_latest: true
